        ctx.strokeStyle = '#0a0a0c';
        ctx.stroke();
        ctx.restore();
      }

      function drawYardCenterLogo(ctx, pIdx) {
        const u = cellPx;
        const [gx, gy] = YARD_CENTERS[pIdx];
        const cx = gx * u;
        const cy = gy * u;
        const mode = state.players[pIdx].mode;
        const isTurn = state.turnIndex === pIdx && state.phase !== 'GAMEOVER';
        const popScale = anim.facePopScales[pIdx] || 1;
        const idleBounce = isTurn ? Math.sin(anim.tick * 0.11) * (u * 0.04) : 0;

        const dx = anim.lookTarget.x - gx;
        const dy = anim.lookTarget.y - gy;
        const dist = Math.hypot(dx, dy) || 1;
        const lookX = (dx / dist) * u * 0.045;
        const lookY = (dy / dist) * u * 0.045;

        const blinkCycle = (anim.tick + pIdx * 47) % 190;
        const isBlinking = blinkCycle > 182;

        ctx.save();
        ctx.translate(cx, cy + idleBounce);
        ctx.scale(popScale, popScale);

        const eyeOffsetX = u * 0.34;
        const eyeOffsetY = -u * 0.17;
        const strokeW = Math.max(2.5, u * 0.095);

        ctx.fillStyle = '#0a0a0c';
        ctx.strokeStyle = '#0a0a0c';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (mode === 'HUM') {
          const eyeR = u * 0.115;
          [-1, 1].forEach(dir => {
            const ex = dir * eyeOffsetX + lookX;
            const ey = eyeOffsetY + lookY;
            if (isBlinking) {
              ctx.lineWidth = strokeW * 0.85;
              ctx.beginPath();
              ctx.moveTo(ex - eyeR, ey);
              ctx.lineTo(ex + eyeR, ey);
              ctx.stroke();
            } else {
              ctx.beginPath();
              ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
              ctx.fill();
            }
          });

          ctx.lineWidth = strokeW;
          ctx.beginPath();
          ctx.arc(lookX * 0.4, u * 0.12 + lookY * 0.4, u * 0.25, 0.12 * Math.PI, 0.88 * Math.PI, false);
          ctx.stroke();
        } else if (mode === 'CPU') {
          const bw = u * 0.23;
          const bh = isBlinking ? u * 0.05 : u * 0.21;
          [-1, 1].forEach(dir => {
            const ex = dir * (u * 0.26) + lookX * 0.7;
            const ey = eyeOffsetY + lookY * 0.7;
            ctx.save();
            ctx.translate(ex, ey);
            ctx.rotate(dir * -0.05);
            ctx.beginPath();
            if (ctx.roundRect) {
              ctx.roundRect(-bw / 2, -bh / 2, bw, bh, u * 0.045);
            } else {
              ctx.rect(-bw / 2, -bh / 2, bw, bh);
            }
            ctx.fill();
            ctx.restore();
          });

          const mw = isTurn ? u * 0.36 + Math.sin(anim.tick * 0.22) * u * 0.05 : u * 0.34;
          const mh = u * 0.125;
          const mx = -mw / 2 + lookX * 0.35;
          const my = u * 0.19 + lookY * 0.35;
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(mx, my, mw, mh, mh * 0.5);
          } else {
            ctx.rect(mx, my, mw, mh);
          }
          ctx.fill();
        } else {
          ctx.globalAlpha = 0.4;
          ctx.lineWidth = strokeW * 0.8;
          [-1, 1].forEach(dir => {
            const ex = dir * eyeOffsetX;
            ctx.beginPath();
            ctx.moveTo(ex - u * 0.12, eyeOffsetY);
            ctx.lineTo(ex + u * 0.12, eyeOffsetY);
            ctx.stroke();
          });
          ctx.beginPath();
          ctx.arc(0, u * 0.2, u * 0.06, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function drawYardScoreCells(ctx, pIdx, thinW, thickW) {
        const u = cellPx;
        const f = FACTIONS[pIdx];
        const scoredCount = state.players[pIdx].tokens.filter(s => s === 56).length;
        const inFlightCount = anim.scoringTokens.filter(st => st.p === pIdx).length;
        const filledCells = Math.max(0, scoredCount - inFlightCount);

        for (let c = 0; c < 4; c++) {
          const rect = getScoreCellRect(pIdx, c);
          const isFilled = c < filledCells;
          const popScale = anim.cellPopScales[pIdx][c] || 1;

          const rx = rect.x * u;
          const ry = rect.y * u;
          const rw = rect.w * u;
          const rh = rect.h * u;
          const rcx = rect.cx * u;
          const rcy = rect.cy * u;

          ctx.save();
          if (popScale !== 1) {
            ctx.translate(rcx, rcy);
            ctx.scale(popScale, popScale);
            ctx.translate(-rcx, -rcy);
          }

          ctx.fillStyle = isFilled ? f.tint : '#ffffff';
          ctx.fillRect(rx, ry, rw, rh);

          if (isFilled) {
            const inset = rw * 0.11;
            ctx.fillStyle = f.color;
            ctx.fillRect(rx + inset, ry + inset, rw - inset * 2, rh - inset * 2);

            ctx.beginPath();
            ctx.arc(rcx, rcy, rw * 0.20, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = Math.max(1.5, thinW * 0.9);
            ctx.strokeStyle = '#0a0a0c';
            ctx.stroke();
          }

          ctx.lineWidth = thickW * 0.88;
          ctx.strokeStyle = '#0a0a0c';
          ctx.strokeRect(rx, ry, rw, rh);

          ctx.restore();
        }
      }

      function drawCenter3DDie(ctx) {
        const u = cellPx;
        const cx = 7.5 * u;
        const cy = 7.5 * u;
        const d = anim.dice;

        const isHumanRollReady =
          state.phase === 'ROLL' &&
          state.players[state.turnIndex].mode === 'HUM';

        const idleBreath = isHumanRollReady ? Math.sin(anim.tick * 0.1) * 0.08 : 0;
        const lift = d.zLift + Math.max(0, idleBreath);

        const baseHalf = u * 0.48 * (1 + lift * 0.28);

        const tiltX = -0.24 + (isHumanRollReady ? Math.sin(anim.tick * 0.06) * 0.05 : 0);
        const tiltY = 0.22 + (isHumanRollReady ? Math.cos(anim.tick * 0.06) * 0.05 : 0);

        function transformPoint(vx, vy, vz) {
          let x1 = vx * Math.cos(d.ry) + vz * Math.sin(d.ry);
          let y1 = vy;
          let z1 = -vx * Math.sin(d.ry) + vz * Math.cos(d.ry);

          let x2 = x1;
          let y2 = y1 * Math.cos(d.rx) - z1 * Math.sin(d.rx);
          let z2 = y1 * Math.sin(d.rx) + z1 * Math.cos(d.rx);

          let x3 = x2 * Math.cos(d.rz) - y2 * Math.sin(d.rz);
          let y3 = x2 * Math.sin(d.rz) + y2 * Math.cos(d.rz);
          let z3 = z2;

          let x4 = x3 * Math.cos(tiltY) + z3 * Math.sin(tiltY);
          let y4 = y3;
          let z4 = -x3 * Math.sin(tiltY) + z3 * Math.cos(tiltY);

          let x5 = x4;
          let y5 = y4 * Math.cos(tiltX) - z4 * Math.sin(tiltX);
          let z5 = y4 * Math.sin(tiltX) + z4 * Math.cos(tiltX);

          const fov = 4.2;
          const persp = fov / (fov - z5 * 0.55);
          return {
            x: x5 * baseHalf * d.scaleX * persp,
            y: y5 * baseHalf * d.scaleY * persp - lift * u * 0.24,
            z: z5
          };
        }

        ctx.save();
        ctx.translate(cx, cy);

        if (isHumanRollReady) {
          const pulse = 1 + Math.sin(anim.tick * 0.13) * 0.09;
          const rSize = u * 0.64 * pulse;
          ctx.save();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = Math.max(2.5, u * 0.07);
          ctx.strokeRect(-rSize, -rSize, rSize * 2, rSize * 2);
          ctx.restore();
        }

        const shOffset = u * (0.10 + lift * 0.16);
        const shSize = baseHalf * (1.06 - lift * 0.08);
        ctx.fillStyle = 'rgba(10, 10, 12, 0.85)';
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(-shSize + shOffset, -shSize + shOffset, shSize * 2, shSize * 2, u * 0.08);
        } else {
          ctx.rect(-shSize + shOffset, -shSize + shOffset, shSize * 2, shSize * 2);
        }
        ctx.fill();

        const cubeFaces = [
          { val: 1, n: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0] },
          { val: 6, n: [0, 0, -1], u: [-1, 0, 0], v: [0, 1, 0] },
          { val: 2, n: [0, 1, 0], u: [1, 0, 0], v: [0, 0, -1] },
          { val: 5, n: [0, -1, 0], u: [1, 0, 0], v: [0, 0, 1] },
          { val: 3, n: [1, 0, 0], u: [0, 0, -1], v: [0, 1, 0] },
          { val: 4, n: [-1, 0, 0], u: [0, 0, 1], v: [0, 1, 0] }
        ];

        const pipCoords2D = {
          1: [[0, 0]],
          2: [[-0.48, -0.48], [0.48, 0.48]],
          3: [[-0.5, -0.5], [0, 0], [0.5, 0.5]],
          4: [[-0.46, -0.46], [0.46, -0.46], [-0.46, 0.46], [0.46, 0.46]],
          5: [[-0.48, -0.48], [0.48, -0.48], [0, 0], [-0.48, 0.48], [0.48, 0.48]],
          6: [[-0.46, -0.52], [0.46, -0.52], [-0.46, 0], [0.46, 0], [-0.46, 0.52], [0.46, 0.52]]
        };

        const projectedFaces = cubeFaces.map(f => {
          const [nx, ny, nz] = f.n;
          const [ux, uy, uz] = f.u;
          const [vx, vy, vz] = f.v;

          const corners3D = [
            [nx - ux - vx, ny - uy - vy, nz - uz - vz],
            [nx + ux - vx, ny + uy - vy, nz + uz - vz],
            [nx + ux + vx, ny + uy + vy, nz + uz + vz],
            [nx - ux + vx, ny - uy + vy, nz - uz + vz]
          ];

          const pts = corners3D.map(c => transformPoint(c[0], c[1], c[2]));
          const centerPt = transformPoint(nx, ny, nz);
          const originPt = transformPoint(0, 0, 0);
          const normalZ = centerPt.z - originPt.z;

          const cross =
            (pts[1].x - pts[0].x) * (pts[2].y - pts[0].y) -
            (pts[1].y - pts[0].y) * (pts[2].x - pts[0].x);

          return {
            val: f.val,
            f,
            pts,
            avgZ: (pts[0].z + pts[1].z + pts[2].z + pts[3].z) * 0.25,
            normalZ,
            visible: cross > 0
          };
        }).filter(pf => pf.visible);

        projectedFaces.sort((a, b) => a.avgZ - b.avgZ);

        const edgeW = Math.max(2.5, u * 0.085);

        projectedFaces.forEach(pf => {
          const { pts, f, val, normalZ } = pf;

          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          ctx.lineTo(pts[1].x, pts[1].y);
          ctx.lineTo(pts[2].x, pts[2].y);
          ctx.lineTo(pts[3].x, pts[3].y);
          ctx.closePath();

          if (normalZ > 0.72) {
            ctx.fillStyle = '#ffffff';
          } else if (normalZ > 0.25) {
            ctx.fillStyle = '#e5e0d2';
          } else {
            ctx.fillStyle = '#c9c3b2';
          }
          ctx.fill();

          ctx.lineWidth = edgeW;
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#0a0a0c';
          ctx.stroke();

          const pips = pipCoords2D[val] || pipCoords2D[5];
          const [nx, ny, nz] = f.n;
          const [ux, uy, uz] = f.u;
          const [vx, vy, vz] = f.v;

          pips.forEach(([pu, pv]) => {
            const pCenter = transformPoint(
              nx + ux * pu + vx * pv,
              ny + uy * pu + vy * pv,
              nz + uz * pu + vz * pv
            );
            const pipR = baseHalf * (val === 1 ? 0.22 : 0.155) * Math.max(0.45, normalZ);
            ctx.beginPath();
            ctx.arc(pCenter.x, pCenter.y, pipR, 0, Math.PI * 2);
            ctx.fillStyle = val === 6 ? FACTIONS[state.turnIndex].color : '#0a0a0c';
            ctx.fill();
            if (val === 6) {
              ctx.lineWidth = Math.max(1, u * 0.03);
              ctx.strokeStyle = '#0a0a0c';
              ctx.stroke();
            }
          });
        });

        ctx.restore();
      }

      function drawCenterRolledNumbers(ctx) {
        const u = cellPx;
        for (let p = 0; p < 4; p++) {
          const cn = anim.centerNumbers[p];
          if (cn.val === null || cn.alpha <= 0.01) continue;

          const [gx, gy] = CENTER_NUMBER_SLOTS[p];
          const px = gx * u;
          const py = gy * u;

          ctx.save();
          ctx.translate(px, py);
          ctx.scale(cn.scale, cn.scale);
          ctx.globalAlpha = cn.alpha;

          const fontSize = Math.round(u * 0.64);
          ctx.font = `900 ${fontSize}px "Barlow Condensed", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const sh = Math.max(1.5, u * 0.055);
          ctx.fillStyle = '#0a0a0c';
          ctx.fillText(String(cn.val), sh, sh);

          ctx.lineWidth = Math.max(3, u * 0.11);
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#0a0a0c';
          ctx.strokeText(String(cn.val), 0, 0);

          ctx.fillStyle = '#ffffff';
          ctx.fillText(String(cn.val), 0, 0);

          ctx.restore();
        }
      }

      function drawStrikeAimOverlay(ctx) {
        if (!anim.strike.dragging || state.phase !== 'STRIKE_AIM') return;
        const u = cellPx;
        const sx = anim.strike.startX * u;
        const sy = anim.strike.startY * u;

        const shotDx = anim.strike.startX - anim.strike.pullX;
        const shotDy = anim.strike.startY - anim.strike.pullY;
        const rawDist = Math.hypot(shotDx, shotDy);
        if (rawDist < 0.12) return;

        const pullMag = Math.min(3.2, rawDist);
        const dirX = shotDx / rawDist;
        const dirY = shotDy / rawDist;
        const clampedPullX = (anim.strike.startX - dirX * pullMag) * u;
        const clampedPullY = (anim.strike.startY - dirY * pullMag) * u;

        ctx.save();

        // 1. Slingshot Tether Line + Brutalist Square Pull Handle
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(clampedPullX, clampedPullY);
        ctx.lineWidth = Math.max(3, u * 0.1);
        ctx.strokeStyle = '#0a0a0c';
        ctx.stroke();

        const handleSz = u * 0.36;
        ctx.fillStyle = FACTIONS[state.turnIndex].color;
        ctx.fillRect(clampedPullX - handleSz * 0.5, clampedPullY - handleSz * 0.5, handleSz, handleSz);
        ctx.lineWidth = Math.max(2, u * 0.065);
        ctx.strokeStyle = '#0a0a0c';
        ctx.strokeRect(clampedPullX - handleSz * 0.5, clampedPullY - handleSz * 0.5, handleSz, handleSz);

        // 2. Forward Trajectory Line & Brutalist Square Nodes (+50% reach preview)
        const beamLen = pullMag * 2.85 * u;
        const endX = sx + dirX * beamLen;
        const endY = sy + dirY * beamLen;

        ctx.beginPath();
        ctx.setLineDash([u * 0.18, u * 0.12]);
        ctx.lineDashOffset = -(anim.tick * 1.2);
        ctx.moveTo(sx, sy);
        ctx.lineTo(endX, endY);
        ctx.lineWidth = Math.max(3, u * 0.095);
        ctx.strokeStyle = '#0a0a0c';
        ctx.stroke();
        ctx.setLineDash([]);

        const snakeCols = ['#ff2e1f', '#00b862', '#ffb800', '#1f5eff'];
        const steps = 6;
        const nodeSz = u * 0.2;
        for (let i = 1; i <= steps; i++) {
          const f = i / (steps + 1);
          const bx = sx + dirX * beamLen * f;
          const by = sy + dirY * beamLen * f;
          ctx.fillStyle = snakeCols[(i + Math.floor(anim.tick / 5)) % 4];
          ctx.fillRect(bx - nodeSz * 0.5, by - nodeSz * 0.5, nodeSz, nodeSz);
          ctx.lineWidth = Math.max(1.5, u * 0.04);
          ctx.strokeStyle = '#0a0a0c';
          ctx.strokeRect(bx - nodeSz * 0.5, by - nodeSz * 0.5, nodeSz, nodeSz);
        }

        // 3. Brutalist Arrowhead at (endX, endY)
        const ang = Math.atan2(dirY, dirX);
        const ahSz = u * 0.32;
        ctx.save();
        ctx.translate(endX, endY);
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.moveTo(ahSz, 0);
        ctx.lineTo(-ahSz * 0.6, -ahSz * 0.7);
        ctx.lineTo(-ahSz * 0.6, ahSz * 0.7);
        ctx.closePath();
        ctx.fillStyle = FACTIONS[state.turnIndex].color;
        ctx.fill();
        ctx.lineWidth = Math.max(2, u * 0.065);
        ctx.strokeStyle = '#0a0a0c';
        ctx.stroke();
        ctx.restore();

        ctx.restore();
      }

      function drawBoard() {
        if (!boardPx) resizeCanvases();
        const ctx = bCtx;
        const S = boardPx;
        const u = cellPx;
        const thinW = Math.max(1.5, u * 0.055);
        const thickW = Math.max(3, u * 0.11);

        ctx.save();
        ctx.clearRect(0, 0, S, S);

        if (anim.screenShake > 0.2) {
          const sx = (Math.random() - 0.5) * anim.screenShake;
          const sy = (Math.random() - 0.5) * anim.screenShake;
          ctx.translate(sx, sy);
          anim.screenShake *= 0.82;
        } else {
          anim.screenShake = 0;
        }

        // 1. Base Archival Surface
        ctx.fillStyle = '#f4f1e8';
        ctx.fillRect(0, 0, S, S);

        // 2. Colored Home Stretches
        HOME_PATHS.forEach((path, pIdx) => {
          ctx.fillStyle = FACTIONS[pIdx].color;
          path.forEach(([x, y]) => {
            ctx.fillRect(x * u, y * u, u, u);
          });
        });

        // 3. Safe Squares (4 Colored Starts + 4 Concrete Star Squares)
        SAFE_TRACK_INDICES.forEach(gIdx => {
          const [x, y] = MAIN_TRACK[gIdx];
          const owner = START_SQUARE_OWNER[gIdx];
          ctx.fillStyle = owner !== undefined ? FACTIONS[owner].color : '#dad6c8';
          ctx.fillRect(x * u, y * u, u, u);
        });

        // 4. Track Cell Grid Lines
        ctx.strokeStyle = '#0a0a0c';
        ctx.lineWidth = thinW;
        for (let x = 0; x < 15; x++) {
          for (let y = 0; y < 15; y++) {
            const inCornerYard = (x < 6 || x > 8) && (y < 6 || y > 8);
            const inCenterGoal = x >= 6 && x <= 8 && y >= 6 && y <= 8;
            if (!inCornerYard && !inCenterGoal) {
              ctx.strokeRect(x * u, y * u, u, u);
            }
          }
        }

        // 4b. Highlight ONLY the Active Player's 6-Cell Home Column Boundary (5 colour + 1 white) during Strike
        if (state.phase === 'STRIKE_AIM' || state.phase === 'STRIKE_SIM') {
          const [bx0, by0, bx1, by1] = HOME_COLUMN_BARRIERS[state.turnIndex];
          ctx.save();
          ctx.strokeStyle = '#0a0a0c';
          ctx.lineWidth = thickW * 1.45;
          ctx.strokeRect(bx0 * u, by0 * u, (bx1 - bx0) * u, (by1 - by0) * u);
          ctx.restore();
        }

        // 5. Start Chevrons & Safe Stars
        const startAngles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
        SAFE_TRACK_INDICES.forEach(gIdx => {
          const [x, y] = MAIN_TRACK[gIdx];
          const owner = START_SQUARE_OWNER[gIdx];
          if (owner !== undefined) {
            drawChevron(ctx, x, y, startAngles[owner]);
          } else {
            drawStar(ctx, (x + 0.5) * u, (y + 0.5) * u, u * 0.34, u * 0.15);
          }
        });

        // 6. Four 6x6 Corner Yards + 4 Square Score Cells + Center Human/Bot Logos
        YARD_BOUNDS.forEach(([x0, y0, x1, y1], pIdx) => {
          const f = FACTIONS[pIdx];
          const mode = state.players[pIdx].mode;
          const isTurn = state.turnIndex === pIdx && state.phase !== 'GAMEOVER';
          const wx = x0 * u;
          const wy = y0 * u;
          const ww = (x1 - x0) * u;

          ctx.fillStyle = mode === 'OFF' ? '#beb9a8' : f.color;
          ctx.fillRect(wx, wy, ww, ww);

          const pad = YARD_PAD * u;
          ctx.fillStyle = mode === 'OFF' ? '#dad6c8' : isTurn ? '#ffffff' : '#f4f1e8';
          ctx.fillRect(wx + pad, wy + pad, ww - pad * 2, ww - pad * 2);

          if (isTurn) {
            ctx.save();
            ctx.strokeStyle = f.color;
            ctx.lineWidth = Math.max(2, u * 0.08);
            const inset = pad + u * 0.11;
            ctx.strokeRect(wx + inset, wy + inset, ww - inset * 2, ww - inset * 2);
            ctx.restore();
          }

          ctx.lineWidth = thickW;
          ctx.strokeStyle = '#0a0a0c';
          ctx.strokeRect(wx + pad, wy + pad, ww - pad * 2, ww - pad * 2);
          ctx.strokeRect(wx, wy, ww, ww);

          YARD_SLOTS[pIdx].forEach(([sx, sy]) => {
            ctx.beginPath();
            ctx.arc(sx * u, sy * u, u * 0.54, 0, Math.PI * 2);
            ctx.fillStyle = mode === 'OFF' ? '#beb9a8' : f.tint;
            ctx.fill();
            ctx.lineWidth = thinW * 1.35;
            ctx.strokeStyle = '#0a0a0c';
            ctx.stroke();
          });

          drawYardCenterLogo(ctx, pIdx);
          drawYardScoreCells(ctx, pIdx, thinW, thickW);
        });

        // 7. Center 3x3 Home Zone (4 Colored Areas + Rolled Number + 3D Die)
        const gx = 6 * u;
        const gy = 6 * u;
        const gw = 3 * u;
        const cx = 7.5 * u;
        const cy = 7.5 * u;

        const tris = [
          { p: 0, pts: [[gx, gy + gw], [gx + gw, gy + gw], [cx, cy]] },
          { p: 1, pts: [[gx, gy], [gx, gy + gw], [cx, cy]] },
          { p: 2, pts: [[gx, gy], [gx + gw, gy], [cx, cy]] },
          { p: 3, pts: [[gx + gw, gy], [gx + gw, gy + gw], [cx, cy]] }
        ];

        tris.forEach(({ p, pts }) => {
          ctx.beginPath();
          ctx.moveTo(pts[0][0], pts[0][1]);
          ctx.lineTo(pts[1][0], pts[1][1]);
          ctx.lineTo(pts[2][0], pts[2][1]);
          ctx.closePath();
          ctx.fillStyle = FACTIONS[p].color;
          ctx.fill();
          ctx.lineWidth = thickW * 0.85;
          ctx.strokeStyle = '#0a0a0c';
          ctx.stroke();
        });

        ctx.lineWidth = thickW;
        ctx.strokeStyle = '#0a0a0c';
        ctx.strokeRect(gx, gy, gw, gw);

        drawCenterRolledNumbers(ctx);
        drawCenter3DDie(ctx);

        // 8. Draw Brutalist Square Striker Trails
        for (let i = anim.trails.length - 1; i >= 0; i--) {
          const tr = anim.trails[i];
          tr.alpha -= 0.045;
          tr.sz *= 0.94;
          if (tr.alpha <= 0) {
            anim.trails.splice(i, 1);
            continue;
          }
          const tSz = tr.sz * u;
          ctx.save();
          ctx.globalAlpha = tr.alpha;
          ctx.fillStyle = tr.color;
          ctx.fillRect(tr.x * u - tSz * 0.5, tr.y * u - tSz * 0.5, tSz, tSz);
          ctx.lineWidth = Math.max(1, u * 0.03);
          ctx.strokeStyle = '#0a0a0c';
          ctx.strokeRect(tr.x * u - tSz * 0.5, tr.y * u - tSz * 0.5, tSz, tSz);
          ctx.restore();
        }

        // 9. Compute Unified Token Layout
        const tokensToDraw = computeRenderedTokens();

        // 10. Draw Move Preview Trajectories & Destination Targets
        tokensToDraw.forEach(tk => {
          if (!tk.isSelectable || tk.destX === null) return;
          const sx = tk.x * u;
          const sy = tk.y * u;
          const tx = tk.destX * u;
          const ty = tk.destY * u;

          ctx.save();
          ctx.beginPath();
          ctx.setLineDash([u * 0.16, u * 0.12]);
          ctx.lineDashOffset = -(anim.tick * 0.6);
          ctx.moveTo(sx, sy);
          ctx.lineTo(tx, ty);
          ctx.lineWidth = Math.max(2, u * 0.08);
          ctx.strokeStyle = '#0a0a0c';
          ctx.stroke();

          ctx.setLineDash([]);
          const rad = u * 0.32 * (1 + Math.sin(anim.tick * 0.15) * 0.1);
          ctx.beginPath();
          ctx.arc(tx, ty, rad, 0, Math.PI * 2);
          ctx.fillStyle = FACTIONS[tk.p].color;
          ctx.fill();
          ctx.lineWidth = Math.max(2, u * 0.07);
          ctx.strokeStyle = '#0a0a0c';
          ctx.stroke();

          if (tk.isCaptureMove) {
            const cr = rad * 0.55;
            ctx.beginPath();
            ctx.moveTo(tx - cr, ty - cr);
            ctx.lineTo(tx + cr, ty + cr);
            ctx.moveTo(tx + cr, ty - cr);
            ctx.lineTo(tx - cr, ty + cr);
            ctx.lineWidth = Math.max(2, u * 0.07);
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
          }
          ctx.restore();
        });

        // 11. Draw Shockwaves
        anim.shockwaves.forEach(sw => {
          ctx.save();
          ctx.beginPath();
          ctx.arc(sw.x * u, sw.y * u, u * (0.25 + sw.progress * sw.maxR), 0, Math.PI * 2);
          ctx.strokeStyle = sw.color;
          ctx.lineWidth = Math.max(2, u * 0.15 * (1 - sw.progress));
          ctx.stroke();
          ctx.restore();
        });

        // 12. Draw Static, Strike-Ready & Selectable Tokens (with Seals)
        tokensToDraw.forEach(tk => {
          drawTokenDisc(
            ctx,
            tk.p,
            tk.x * u,
            tk.y * u,
            tk.scale,
            tk.scale,
            tk.isSelectable || tk.isStrikeReady,
            tk.isStrikeReady,
            tk.seals || 0
          );
        });

        // 13. Draw Slingshot Aiming Vector on top of tokens
        drawStrikeAimOverlay(ctx);

        // 14. Draw Returning Captured Tokens
        anim.returningTokens.forEach(rt => {
          const rSeals = state.players[rt.p].seals[rt.t] || 0;
          drawTokenDisc(ctx, rt.p, rt.x * u, rt.y * u, 0.9, 0.9, false, false, rSeals);
        });

        // 15. Draw Active Hopping Token on Top
        if (anim.activeHop) {
          const ah = anim.activeHop;
          const ahSeals = state.players[ah.p].seals[ah.t] || 0;
          drawTokenDisc(ctx, ah.p, ah.x * u, ah.y * u, ah.scaleX, ah.scaleY, false, false, ahSeals);
        }

        // 16. Draw Scoring Tokens Flying into Yard Score Cells
        anim.scoringTokens.forEach(st => {
          drawTokenDisc(ctx, st.p, st.x * u, st.y * u, st.scale, st.scale, false, false, 0);
        });

        // 17. Update & Draw Juicy Particles
        for (let i = anim.particles.length - 1; i >= 0; i--) {
          const pt = anim.particles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.vy += 0.0035;
          pt.rot += pt.vrot;
          pt.alpha -= pt.decay;

          if (pt.alpha <= 0) {
            anim.particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = pt.alpha;
          ctx.translate(pt.x * u, pt.y * u);
          ctx.rotate(pt.rot);
          const sz = pt.size * u;
          ctx.fillStyle = pt.color;
          ctx.fillRect(-sz / 2, -sz / 2, sz, sz);
          ctx.lineWidth = Math.max(1, u * 0.03);
          ctx.strokeStyle = '#0a0a0c';
          ctx.strokeRect(-sz / 2, -sz / 2, sz, sz);
          ctx.restore();
        }

        ctx.restore();
      }

      // Draw Token Disc + T-Nail Seal Clamps (1, 2, or 3 seals) matching Image 1
      function drawTokenDisc(ctx, pIdx, px, py, scaleX, scaleY, isHighlighted, isStrikeReady, sealsCount = 0) {
        const u = cellPx;
        const f = FACTIONS[pIdx];
        const r = u * 0.36;
        const strokeW = Math.max(2, u * 0.065);

        ctx.save();
        ctx.translate(px, py);

        if (isHighlighted) {
          const pulse = 1 + Math.sin(anim.tick * 0.16) * 0.15;
          if (isStrikeReady) {
            const sq = r * 1.38 * pulse;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-sq, -sq, sq * 2, sq * 2);
            ctx.lineWidth = Math.max(2.5, u * 0.075);
            ctx.strokeStyle = '#0a0a0c';
            ctx.strokeRect(-sq, -sq, sq * 2, sq * 2);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.45 * pulse, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = Math.max(2.5, u * 0.08);
            ctx.strokeStyle = '#0a0a0c';
            ctx.stroke();
          }
        }

        ctx.scale(scaleX, scaleY);

        // Hard brutalist offset shadow
        const sh = u * 0.08;
        ctx.beginPath();
        ctx.arc(sh, sh, r, 0, Math.PI * 2);
        ctx.fillStyle = '#0a0a0c';
        ctx.fill();

        // Main colored token disc
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();
        ctx.lineWidth = strokeW;
        ctx.strokeStyle = '#0a0a0c';
        ctx.stroke();

        // If UNSEALED (sealsCount === 0): draw the open white inner circle (top piece in Image 1).
        // If SEALED (sealsCount > 0): center remains solid faction color (bottom piece in Image 1)
        // and draw 1, 2, or 3 black T-shaped nail seals driven into the ring!
        if (sealsCount === 0) {
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.48, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = strokeW * 0.85;
          ctx.strokeStyle = '#0a0a0c';
          ctx.stroke();
        } else {
          const pinCount = Math.min(3, sealsCount);
          const shaftW = Math.max(2.5, u * 0.105);
          const innerStart = r * 0.88;
          const outerEnd = u * 0.64;
          const headHalfW = u * 0.14;

          ctx.strokeStyle = '#0a0a0c';
          ctx.fillStyle = '#0a0a0c';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          for (let i = 0; i < pinCount; i++) {
            const ang = SEAL_ANGLES[i];
            ctx.save();
            ctx.rotate(ang);

            // Radial black nail shaft clamping from the colored disc edge across the outer ring
            ctx.lineWidth = shaftW;
            ctx.beginPath();
            ctx.moveTo(innerStart, 0);
            ctx.lineTo(outerEnd, 0);
            ctx.stroke();

            // Perpendicular black T-nail cap at outerEnd
            ctx.lineWidth = shaftW * 1.15;
            ctx.beginPath();
            ctx.moveTo(outerEnd, -headHalfW);
            ctx.lineTo(outerEnd, headHalfW);
            ctx.stroke();

            ctx.restore();
          }
        }

        ctx.restore();
      }

      function renderLoop() {
        anim.tick++;
        drawBoard();
        requestAnimationFrame(renderLoop);
      }

      /* =========================================================================
         10. SPATIAL BOARD INPUT HANDLERS (STRIKE DRAG-AIM-SHOOT, DIE & LOGOS)
         ========================================================================= */
      function getGridXYFromEvent(e) {
        const rect = boardCanvas.getBoundingClientRect();
        return {
          x: ((e.clientX - rect.left) / rect.width) * 15,
          y: ((e.clientY - rect.top) / rect.height) * 15
        };
      }

      function cycleFactionMode(p) {
        const curMode = state.players[p].mode;
        const activeCount = state.players.filter(pl => pl.mode !== 'OFF').length;
        let nextMode = 'HUM';
        if (curMode === 'HUM') nextMode = 'CPU';
        else if (curMode === 'CPU') nextMode = activeCount > 2 ? 'OFF' : 'HUM';
        else nextMode = 'HUM';

        state.players[p].mode = nextMode;
        sfx.toggleMode();
        popYardFace(p);

        if (p === state.turnIndex && nextMode === 'OFF') {
          passTurnToNextPlayer();
        } else {
          syncTurnFlow();
        }
      }

      boardCanvas.addEventListener('pointerdown', e => {
        e.preventDefault();
        sfx.init();

        const { x: clickX, y: clickY } = getGridXYFromEvent(e);

        // 1. Check if user tapped any Yard's Center Human / Bot Logo (at [3,3], [12,3], [3,12], [12,12])
        for (let p = 0; p < 4; p++) {
          const [cx, cy] = YARD_CENTERS[p];
          if (Math.hypot(clickX - cx, clickY - cy) < 0.76) {
            cycleFactionMode(p);
            return;
          }
        }

        const pIdx = state.turnIndex;
        const curP = state.players[pIdx];
        if (curP.mode !== 'HUM') return;

        // 2. Mandatory STRIKE_AIM Phase: Grab any of the current player's eligible pieces to drag & shoot
        if (state.phase === 'STRIKE_AIM') {
          const rendered = computeRenderedTokens().filter(tk => tk.p === pIdx && tk.isStrikeReady);
          let bestToken = -1;
          let bestDist = 1.65;
          let startX = clickX;
          let startY = clickY;

          for (const tk of rendered) {
            const d = Math.hypot(clickX - tk.x, clickY - tk.y);
            if (d < bestDist) {
              bestDist = d;
              bestToken = tk.t;
              startX = tk.x;
              startY = tk.y;
            }
          }

          if (bestToken !== -1) {
            anim.strike.dragging = true;
            anim.strike.pointerId = e.pointerId;
            anim.strike.tokenIdx = bestToken;
            anim.strike.startX = startX;
            anim.strike.startY = startY;
            anim.strike.pullX = clickX;
            anim.strike.pullY = clickY;
            try {
              boardCanvas.setPointerCapture(e.pointerId);
            } catch (_) {}
          }
          return;
        }

        // 3. ROLL Phase: Tapping the Center 3D Die (or anywhere on the board) rolls the die
        if (state.phase === 'ROLL') {
          startDiceRoll();
          return;
        }

        if (state.phase !== 'MOVE') return;

        const rendered = computeRenderedTokens().filter(tk => tk.isSelectable);

        // 4. Direct hit-test against rendered selectable tokens
        let bestToken = -1;
        let bestDist = 1.45;
        for (const tk of rendered) {
          const d = Math.hypot(clickX - tk.x, clickY - tk.y);
          if (d < bestDist) {
            bestDist = d;
            bestToken = tk.t;
          }
        }
        if (bestToken !== -1) {
          performTokenMove(pIdx, bestToken);
          return;
        }

        // 5. Hit-test against highlighted destination markers
        let bestDestDist = 1.15;
        for (const tk of rendered) {
          if (tk.destX !== null) {
            const d = Math.hypot(clickX - tk.destX, clickY - tk.destY);
            if (d < bestDestDist) {
              bestDestDist = d;
              bestToken = tk.t;
            }
          }
        }
        if (bestToken !== -1) {
          performTokenMove(pIdx, bestToken);
          return;
        }

        // 6. Whole-Yard tap detection if player has a deployable token in Yard
        const [x0, y0, x1, y1] = YARD_BOUNDS[pIdx];
        if (clickX >= x0 && clickX <= x1 && clickY >= y0 && clickY <= y1) {
          // Prefer deploying an unsealed token if available; otherwise break a seal
          const unsealedYardToken = state.validTokens.find(t => curP.tokens[t] === -1 && (curP.seals[t] || 0) === 0);
          const anyYardToken = state.validTokens.find(t => curP.tokens[t] === -1);
          const chosen = unsealedYardToken !== undefined ? unsealedYardToken : anyYardToken;
          if (chosen !== undefined) {
            performTokenMove(pIdx, chosen);
          }
        }
      });

      boardCanvas.addEventListener('pointermove', e => {
        if (!anim.strike.dragging || state.phase !== 'STRIKE_AIM') return;
        const { x, y } = getGridXYFromEvent(e);
        anim.strike.pullX = x;
        anim.strike.pullY = y;
        anim.lookTarget = {
          x: anim.strike.startX + (anim.strike.startX - x),
          y: anim.strike.startY + (anim.strike.startY - y)
        };
      });

      function finishStrikeDrag(e) {
        if (!anim.strike.dragging) return;
        anim.strike.dragging = false;
        try {
          if (anim.strike.pointerId !== null) {
            boardCanvas.releasePointerCapture(anim.strike.pointerId);
          }
        } catch (_) {}

        if (state.phase !== 'STRIKE_AIM') return;
        const shotDx = anim.strike.startX - anim.strike.pullX;
        const shotDy = anim.strike.startY - anim.strike.pullY;
        const pullDist = Math.hypot(shotDx, shotDy);

        if (pullDist >= 0.32) {
          launchStrikeShot(state.turnIndex, anim.strike.tokenIdx, shotDx, shotDy);
        }
      }

      boardCanvas.addEventListener('pointerup', finishStrikeDrag);
      boardCanvas.addEventListener('pointercancel', finishStrikeDrag);

      /* =========================================================================
         11. UTILITY CONTROLS, RESTART & SETTINGS MODAL
         ========================================================================= */
      function openSettingsModal(winnerIdx = null) {
        if (winnerIdx !== null) {
          const names = ['RED', 'GREEN', 'YELLOW', 'BLUE'];
          modalTitle.textContent = `${names[winnerIdx]} WINS!`;
        } else {
          modalTitle.textContent = 'SETTINGS';
        }
        syncSettingsUI();
        settingsModal.classList.add('open');
      }

      function closeSettingsModal() {
        settingsModal.classList.remove('open');
      }

      function startNewMatch() {
        state.epoch++;
        cancelAllAsync();

        state.round = 1;
        state.hasStruckThisTurn = false;
        state.diceValue = null;
        state.sixCount = 0;
        state.validTokens = [];
        state.rankings = [];
        anim.returningTokens = [];
        anim.scoringTokens = [];
        anim.shockwaves = [];
        anim.particles = [];
        anim.trails = [];

        for (let i = 0; i < 4; i++) {
          state.players[i].tokens = [-1, -1, -1, -1];
          state.players[i].seals = [0, 0, 0, 0];
          state.players[i].drought = 0;
          anim.centerNumbers[i] = { val: null, scale: 0, alpha: 0 };
        }

        const first = state.players.findIndex(p => p.mode !== 'OFF');
        state.turnIndex = first !== -1 ? first : 0;
        state.phase = isStrikeRound() ? 'STRIKE_AIM' : 'ROLL';

        closeSettingsModal();
        sfx.deploy();
        syncTurnFlow();
      }

      quickModeBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        sfx.init();
        sfx.toggleMode();
        state.gameMode = state.gameMode === 'STRIKE_DICE' ? 'CLASSIC' : 'STRIKE_DICE';
        if (state.gameMode === 'CLASSIC' && state.phase === 'STRIKE_AIM') {
          state.phase = 'ROLL';
        } else if (state.gameMode === 'STRIKE_DICE' && isStrikeRound() && !state.hasStruckThisTurn && state.phase === 'ROLL') {
          state.phase = 'STRIKE_AIM';
        }
        syncTurnFlow();
      });

      quickSpeedBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        sfx.init();
        state.fastMode = !state.fastMode;
        sfx.toggleMode();
        syncSettingsUI();
        saveState();
      });

      quickSfxBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        sfx.enabled = !sfx.enabled;
        if (sfx.enabled) sfx.toggleMode();
        syncSettingsUI();
        saveState();
      });

      quickRestartBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        sfx.init();
        startNewMatch();
      });

      openSettingsBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        sfx.init();
        sfx.toggleMode();
        openSettingsModal(null);
      });

      closeModalBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        closeSettingsModal();
      });

      resumeBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        closeSettingsModal();
      });

      restartMatchBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        sfx.init();
        startNewMatch();
      });

      document.querySelectorAll('#modeSegGroup .seg-btn').forEach(btn => {
        btn.addEventListener('pointerdown', e => {
          e.preventDefault();
          sfx.init();
          sfx.toggleMode();
          state.gameMode = btn.getAttribute('data-mode');
          if (state.gameMode === 'CLASSIC' && state.phase === 'STRIKE_AIM') {
            state.phase = 'ROLL';
          } else if (state.gameMode === 'STRIKE_DICE' && isStrikeRound() && !state.hasStruckThisTurn && state.phase === 'ROLL') {
            state.phase = 'STRIKE_AIM';
          }
          syncTurnFlow();
        });
      });

      document.querySelectorAll('#freqSegGroup .seg-btn').forEach(btn => {
        btn.addEventListener('pointerdown', e => {
          e.preventDefault();
          sfx.init();
          sfx.toggleMode();
          state.strikeFreq = Number(btn.getAttribute('data-freq'));
          if (isStrikeRound() && !state.hasStruckThisTurn && state.phase === 'ROLL') {
            state.phase = 'STRIKE_AIM';
          } else if (!isStrikeRound() && state.phase === 'STRIKE_AIM') {
            state.phase = 'ROLL';
          }
          syncTurnFlow();
        });
      });

      document.querySelectorAll('#speedSegGroup .seg-btn').forEach(btn => {
        btn.addEventListener('pointerdown', e => {
          e.preventDefault();
          sfx.init();
          state.fastMode = btn.getAttribute('data-spd') === '2';
          sfx.toggleMode();
          syncSettingsUI();
          saveState();
        });
      });

      document.querySelectorAll('#sfxSegGroup .seg-btn').forEach(btn => {
        btn.addEventListener('pointerdown', e => {
          e.preventDefault();
          sfx.enabled = btn.getAttribute('data-sfx') === 'ON';
          if (sfx.enabled) sfx.toggleMode();
          syncSettingsUI();
          saveState();
        });
      });

      document.querySelectorAll('[data-f-card]').forEach(card => {
        card.addEventListener('pointerdown', e => {
          e.preventDefault();
          sfx.init();
          const p = Number(card.getAttribute('data-f-card'));
          cycleFactionMode(p);
        });
      });

      /* =========================================================================
         12. VIEWPORT LIFECYCLE
         ========================================================================= */
      function healCanvas() {
        resizeCanvases();
        drawBoard();
      }

      window.addEventListener('resize', healCanvas);
      window.addEventListener('pageshow', healCanvas);
      window.addEventListener('focus', healCanvas);

      const restored = loadState();
      resizeCanvases();
      syncSettingsUI();
      requestAnimationFrame(renderLoop);
      if (!restored) {
        saveState();
      } else {
        syncTurnFlow();
      }
    })();
  </script>
</body>
</html>
